name: Extract imported workspace

on:
  push:
    paths:
      - "grok-workspace-completed.zip"
      - ".github/workflows/import-workspace.yml"

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract workspace
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq grok-workspace-completed.zip -d .
          rm -f grok-workspace-completed.zip
          rm -rf .github/workflows/import-workspace.yml
          printf '\n## Import validation\n' >> README.md
          printf '%s\n' '- Workspace archive extracted into the repository.' >> README.md
          printf '%s\n' '- Import workflow removed itself after successful extraction.' >> README.md

      - name: Commit extracted workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: extract completed Grok workspace"
          git push origin HEAD:main
